name: Android CI

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Compile, unit tests, lint and debug APK"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted Ubuntu images include the Android SDK and sdkmanager.
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Compile the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # testDebugUnitTest does not include tests in the pure-JVM modules.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:common:test :lint:test --stacktrace

      - name: Check build logic, formatting and Android lint
        run: ./gradlew :build-logic:convention:check spotlessCheck :app:lintDebug :lint:lint --stacktrace

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: luma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results*.html"
          if-no-files-found: warn
          retention-days: 14

# There are currently no androidTest sources. Add an emulator job when instrumented
# tests exist; a successful build is not a substitute for the manual device checks.
